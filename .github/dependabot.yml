version: 2
updates:
  # Keep npm dependencies (Next.js, React, test tooling) current.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      nextjs:
        patterns:
          - 'next'
          - 'eslint-config-next'
      testing:
        patterns:
          - 'jest*'
          - '@testing-library/*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  # Keep the GitHub Actions used by the pipelines current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)

  # Keep the base image of the Dockerfile current.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(docker)
